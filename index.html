<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASE FIGHTER</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
body { background: #0a0a1f; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; }
h1 { font-size: 28px; letter-spacing: 6px; color: #fbbf24; text-shadow: 0 0 20px #f59e0b88; margin-bottom: 8px; }
#subtitle { font-size: 11px; letter-spacing: 1px; color: #4a4a8a; margin-bottom: 14px; text-align: center; }
#container { background: #1a1a2e; border: 2px solid #4a4a8a; border-radius: 10px; padding: 14px; max-width: 680px; width: 100%; position: relative; }

/* Wallet & Leaderboard UI */
#top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px; border: 1px solid #2a2a6e; }
#wallet-btn { background: #fbbf24; color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; box-shadow: 0 3px 0 #92400e; transition: all 0.1s; }
#wallet-btn:hover { background: #f59e0b; transform: translateY(-1px); box-shadow: 0 4px 0 #92400e; }
#wallet-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #92400e; }
#wallet-address { font-size: 10px; color: #fbbf24; display: none; background: rgba(251, 191, 36, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.3); }

#hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.hp-wrap { width: 230px; }
.hp-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.hp-bar { height: 14px; background: #111; border: 1px solid #333; border-radius: 2px; overflow: hidden; }
.hp-fill { height: 100%; transition: width 0.1s; border-radius: 2px; }
#p-hp { background: #4ade80; }
#a-hp { background: #f87171; float: right; }
.hp-wrap.right { text-align: right; }
#mid { text-align: center; min-width: 110px; }
#round-label { font-size: 15px; color: #fbbf24; font-weight: bold; }
#score-label { font-size: 11px; color: #555; margin-top: 2px; }
canvas { display: block; width: 100%; border: 2px solid #2a2a6e; border-radius: 4px; background: #000; }
#msg { text-align: center; font-size: 16px; color: #fbbf24; letter-spacing: 3px; font-weight: bold; min-height: 26px; margin: 12px 0 8px; }

#ctrl { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 20px; padding: 0 10px; width: 100%; position: relative; }
.ctrl-zone { display: flex; flex-direction: column; gap: 8px; }
.ctrl-group { display: flex; gap: 8px; }
.ctrl-group.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { background: #1e1e4e; color: #aaa; border: 2px solid #3a3a7a; border-radius: 14px; padding: 14px; font-size: 18px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: background 0.1s, transform 0.1s; display: flex; align-items: center; justify-content: center; min-width: 65px; min-height: 65px; box-shadow: 0 5px 0 #0f0f2d; position: relative; }
.btn::after { position: absolute; bottom: 4px; font-size: 8px; opacity: 0.4; content: attr(data-key); }
.btn:hover { background: #2a2a6e; color: #fff; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0f0f2d; background: #3a3a9e; }
#btn-fight { color: #fbbf24; border-color: #fbbf24; background: #2a2a1e; font-weight: bold; padding: 10px 20px; font-size: 16px; height: 60px; min-width: 120px; box-shadow: 0 4px 0 #1a1a0a; border-radius: 10px; margin-bottom: 5px; }

@media (max-width: 600px) {
    #ctrl { 
        align-items: flex-end; 
        padding-bottom: 20px; 
        gap: 5px;
        justify-content: space-around;
    }
    .btn { 
        min-width: 50px; 
        min-height: 50px; 
        font-size: 16px; 
        padding: 8px;
        border-radius: 10px;
    }
    .btn::after { font-size: 7px; bottom: 2px; }
    
    #btn-fight { 
        position: absolute; 
        bottom: -5px; 
        left: 50%; 
        transform: translateX(-50%); 
        z-index: 20; 
        font-size: 13px; 
        min-width: 90px; 
        height: 45px;
        padding: 5px 10px;
    }
    
    .ctrl-zone.center { height: 45px; min-width: 90px; }
    .ctrl-zone.left { flex: 1; max-width: 120px; }
    .ctrl-zone.right { flex: 1; max-width: 120px; }
    
    .ctrl-group.grid { gap: 4px; }
    #btn-block { min-height: 40px !important; font-size: 12px; }
}

/* Leaderboard Modal */
#leaderboard-modal { position: absolute; inset: 0; background: rgba(5, 5, 20, 0.98); display: none; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 100; border-radius: 10px; padding: 30px 20px; text-align: center; backdrop-filter: blur(8px); }
.lb-table { width: 100%; max-width: 500px; margin: 20px 0; border-collapse: collapse; background: rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; }
.lb-table th { color: #fbbf24; border-bottom: 2px solid #2a2a6e; padding: 12px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
.lb-table td { padding: 12px 8px; color: #ccc; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.lb-row { animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
@keyframes fadeInSlide {
    from { opacity: 0; transform: translateY(15px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.close-lb { background: #4a4a8a; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }

#hint { text-align: center; font-size: 10px; color: #333; margin-top: 6px; }
#contract-link { font-size: 9px; color: #4a4a8a; text-decoration: none; margin-top: 20px; display: block; }
#contract-link:hover { color: #fbbf24; }
</style>

<!-- Scripts -->
<script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs, serverTimestamp, increment } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

const firebaseConfig = {
  "projectId": "gen-lang-client-0631620790",
  "appId": "1:892855136205:web:8e3433c75f1db623f31e84",
  "apiKey": "AIzaSyDFCpOwUkJws-EV5iemDTk6R0KwrdP1uvo",
  "authDomain": "gen-lang-client-0631620790.firebaseapp.com",
  "firestoreDatabaseId": "ai-studio-47c5dd2d-158c-4d0a-a506-da22f49c71b1",
  "storageBucket": "gen-lang-client-0631620790.firebasestorage.app",
  "messagingSenderId": "892855136205",
  "measurementId": ""
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
let userAddress = null;

console.log("Firebase initialized");
loadLeaderboard();

// Wallet Connection
async function connectWallet() {
    let provider = window.ethereum;
    
    // Handle multiple providers (e.g. OKX and MetaMask both installed)
    if (window.ethereum && window.ethereum.providers) {
        provider = window.ethereum.providers.find((p) => p.isMetaMask) || window.ethereum;
    }

    if (provider) {
        try {
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0].toLowerCase();
            updateWalletUI();
            if (db) {
                const docRef = doc(db, 'leaderboard', userAddress);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    console.log("Welcome back, player with", docSnap.data().wins, "wins");
                }
            }
        } catch (err) {
            console.error("Wallet connection failed", err);
        }
    } else {
        alert("No Web3 wallet detected. Please install MetaMask or another compatible wallet.");
    }
}

function updateWalletUI() {
    const btn = document.getElementById('wallet-btn');
    const span = document.getElementById('wallet-address');
    const pLabel = document.querySelector('.hp-label');
    if (userAddress) {
        btn.style.display = 'none';
        span.style.display = 'inline';
        const shortAddr = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
        span.textContent = shortAddr;
        if (pLabel) pLabel.textContent = shortAddr;
    }
}

async function updateLeaderboardScore() {
    if (!userAddress || !db) {
        console.warn("Cannot sync: Wallet or DB missing");
        return;
    }
    try {
        msg('SYNCING WINS TO BASE...', 9999);
        const docRef = doc(db, 'leaderboard', userAddress.toLowerCase());
        
        await setDoc(docRef, {
            address: userAddress.toLowerCase(),
            wins: increment(1),
            updatedAt: serverTimestamp()
        }, { merge: true });
        
        console.log("Score incremented for:", userAddress);
        msg('WINS SYNCED! 🏆', 140);
        
        // Refresh leaderboard after a short delay
        setTimeout(() => loadLeaderboard(), 2000);
    } catch (err) {
        console.error("Firestore sync error:", err);
        msg('SYNC ERROR: Check Connection', 180);
    }
}

async function loadLeaderboard() {
    const lbBody = document.getElementById('lb-body');
    const lbStatus = document.getElementById('lb-status');
    if (!lbBody) return;
    if (!db) {
        lbBody.innerHTML = '<tr class="lb-row"><td colspan="3">CONNECTING...</td></tr>';
        return;
    }
    try {
        const q = query(collection(db, 'leaderboard'), orderBy('wins', 'desc'), limit(10));
        const querySnapshot = await getDocs(q); 
        lbBody.innerHTML = '';
        let rank = 1;
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            if (!data.address) return;
            const row = document.createElement('tr');
            row.className = 'lb-row';
            row.style.animationDelay = `${(rank - 1) * 0.05}s`;
            const addr = data.address.substring(0, 6) + "..." + data.address.substring(data.address.length - 4);
            const isMe = userAddress && data.address.toLowerCase() === userAddress.toLowerCase();
            const rowStyle = isMe ? 'background: rgba(251,191,36,0.15); border-left: 3px solid #fbbf24;' : '';
            
            row.innerHTML = `
                <td style="${rowStyle}">#${rank++}</td>
                <td style="${rowStyle}">${isMe ? '⭐ YOU' : addr}</td>
                <td style="${rowStyle} color: #fbbf24; font-weight: bold;">${data.wins || 0}</td>
            `;
            lbBody.appendChild(row);
        });
        if (rank === 1) {
            lbBody.innerHTML = '<tr class="lb-row"><td colspan="3">NO CHAMPIONS YET</td></tr>';
        }
        if (lbStatus) lbStatus.textContent = "UP TO DATE";
    } catch (err) {
        console.error("Error loading leaderboard", err);
        lbBody.innerHTML = '<tr class="lb-row"><td colspan="3">ERROR LOADING</td></tr>';
    }
}

document.getElementById('wallet-btn').onclick = connectWallet;

// Leaderboard Display
const lbModal = document.getElementById('leaderboard-modal');
document.getElementById('show-lb-btn').onclick = () => { lbModal.style.display = 'flex'; loadLeaderboard(); };
document.getElementById('close-lb-btn').onclick = () => { lbModal.style.display = 'none'; };
const refreshBtn = document.getElementById('refresh-lb-btn');
if (refreshBtn) refreshBtn.onclick = loadLeaderboard;

/**
 * ── Game Engine (Original Base Fighter Code) ──────────────────
 */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 640, H = 224, FLOOR = 162, GR = 0.55;

// Audio 
let ac = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function beep(freq, dur, type='square', vol=0.15, detune=0) {
  try {
    const a = audio(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.start(); o.stop(a.currentTime + dur);
  } catch(e) {}
}
const snd = {
  punch: () => { beep(180,0.08,'sawtooth',0.2); beep(90,0.1,'square',0.1); },
  kick:  () => { beep(100,0.12,'sawtooth',0.25); beep(60,0.15,'square',0.12); },
  block: () => { beep(400,0.06,'square',0.1); beep(600,0.04,'square',0.08); },
  hurt:  () => { beep(220,0.18,'sawtooth',0.3,-200); },
  jump:  () => { beep(300,0.1,'sine',0.08); },
  win:   () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.15),i*120)); },
  lose:  () => { [300,250,200,150].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.15),i*130)); },
  ko:    () => { [100,150,100,200,50].forEach((f,i)=>setTimeout(()=>beep(f,0.4,'sawtooth',0.2),i*100)); }
};

// State
let P, AI, running=false, round=1, scores=[0,0], raf, msgTimer=0, slowMo=0, shake=0;
let difficulty = 'medium';

const DIFF_SETTINGS = {
  easy:   { react: [40, 80], block: 0.05, agg: 0.3,  speed: 0.4 },
  medium: { react: [18, 45], block: 0.12, agg: 0.45, speed: 0.6 },
  hard:   { react: [8, 22],  block: 0.25, agg: 0.65, speed: 0.8 }
};

document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.diff-btn').forEach(b => {
             b.classList.remove('active');
             b.style.background = 'transparent';
             b.style.color = '#666';
        });
        btn.classList.add('active');
        btn.style.background = '#4a4a8a';
        btn.style.color = '#fff';
        difficulty = btn.dataset.diff;
    };
});

function mkChar(x, facing, isAI) {
  return { x, y:FLOOR, vx:0, vy:0, w:28, h:48,
    hp:100, facing, state:'idle', onGround:true,
    hitFlash:0, blockTimer:0, attackTimer:0, hitbox:null, invincible:0, isAI };
}

function reset() {
  P  = mkChar(80,  1, false);
  AI = mkChar(560,-1, true);
  if (scores[0] === 0 && scores[1] === 0) round = 1;
  draw();
}

// Background
const stars = Array.from({length:40},(_,i)=>({ x:(i*73+11)%W, y:(i*41+7)%(FLOOR-30), s:(i%3)+1 }));

function drawBG() {
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ ctx.fillStyle=`rgba(255,255,255,${0.25+s.s*0.12})`; ctx.fillRect(s.x,s.y,s.s,s.s); });
  for(let i=0;i<6;i++) {
    ctx.fillStyle=`rgba(30,30,80,${0.3+i*0.02})`;
    ctx.fillRect(30+i*105,FLOOR-55-i*8,52,55+i*8);
    ctx.fillStyle='rgba(255,220,80,0.15)';
    for(let r=0;r<3;r++) for(let c=0;c<3;c++) ctx.fillRect(38+i*105+c*14,FLOOR-48-i*8+r*16,8,10);
  }
  ctx.fillStyle='rgba(60,60,160,0.2)'; ctx.fillRect(220,FLOOR-90,200,90);
  ctx.strokeStyle='rgba(100,100,220,0.5)'; ctx.lineWidth=3;
  ctx.strokeRect(228,FLOOR-90,184,90);
  ctx.fillStyle='#5555aa'; ctx.fillRect(0,FLOOR,W,5);
  ctx.fillStyle='#1e1e5e'; ctx.fillRect(0,FLOOR+5,W,H-FLOOR-5);
  for(let i=0;i<12;i++) { ctx.fillStyle=`rgba(80,80,180,${0.1+i*0.01})`; ctx.fillRect(i*55,FLOOR+5,28,5); }
  ctx.fillStyle='rgba(251,191,36,0.12)';
  ctx.font='bold 11px monospace'; ctx.textAlign='center';
  ctx.fillText('BASE FIGHTER', W/2, FLOOR+16);
  ctx.restore();
}

function drawChar(c) {
  let px=Math.round(c.x-c.w/2), py=Math.round(c.y-c.h);
  const f=c.facing, fl=c.hitFlash>0;
  
  if (fl) {
    // Visual recoil: push back slightly and jitter
    px += (f === 1 ? -2 : 2) * (c.hitFlash / 5);
    px += (Math.random() - 0.5) * 4;
    py += (Math.random() - 0.5) * 2;
  }

  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  if(fl) ctx.globalAlpha=0.6;
  const bc=fl?'#fff':(c.isAI?'#f87171':'#4ade80');
  const hc=fl?'#eee':(c.isAI?'#fca5a5':'#86efac');
  const isAirMove = c.state === 'airpunch' || c.state === 'airkick';
  
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(px-4,FLOOR,c.w+8,5);
  
  // Special move aura
  if (isAirMove) {
    ctx.shadowBlur = 15;
    ctx.shadowColor = c.isAI ? '#f87171' : '#4ade80';
  }

  ctx.fillStyle=hc; ctx.fillRect(px+4,py,20,18);
  ctx.fillStyle='#111'; ctx.fillRect(f===1?px+16:px+8,py+6,3,3);
  ctx.fillStyle='#111'; ctx.fillRect(f===1?px+13:px+10,py+13,4,2);
  ctx.fillStyle=bc; ctx.fillRect(px+2,py+18,24,22);
  
  if (isAirMove) {
    // Add some "wind lines" or "motion trails"
    ctx.fillStyle = fl ? '#fff' : bc;
    for(let i=0; i<3; i++) {
        ctx.fillRect(px + (f===1 ? -10-i*5 : 30+i*5), py+20+i*6, 12, 2);
    }
  }

  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(px+8,py+20,12,3);
  if(c.state==='punch' || c.state === 'airpunch') {
    const ext = c.state === 'airpunch' ? 10 : 0;
    ctx.fillStyle=bc; ctx.fillRect(f===1?px+26:px-10-ext,py+22-ext/2,16+ext,8+ext/2);
    ctx.fillStyle=hc; ctx.fillRect(f===1?px+40+ext:px-12-ext,py+21-ext/2,8+ext/2,9+ext/2);
  } else {
    ctx.fillStyle=bc; ctx.fillRect(f===1?px-4:px+28,py+22,10,8);
  }
  if(!c.onGround||c.state==='jump'||isAirMove) {
    ctx.fillStyle=bc; ctx.fillRect(px+4,py+40,10,14); ctx.fillRect(px+14,py+40,10,14);
  } else {
    ctx.fillStyle=bc; ctx.fillRect(px+4,py+40,10,20); ctx.fillRect(px+14,py+40,10,20);
  }
  if(c.state==='kick' || c.state === 'airkick') {
    const ext = c.state === 'airkick' ? 12 : 0;
    ctx.fillStyle=bc; ctx.fillRect(f===1?px+18:px-14-ext,py+42,20+ext,9);
    ctx.fillStyle=hc; ctx.fillRect(f===1?px+36+ext:px-14-ext,py+41,10+ext/2,10+ext/2);
  }
  if(c.state==='block') {
    ctx.fillStyle='rgba(96,165,250,0.45)';
    const sx=f===1?px+18:px-12; ctx.fillRect(sx,py+6,10,36);
    ctx.fillStyle='rgba(186,230,253,0.7)'; ctx.fillRect(sx+2,py+8,6,32);
  }
  ctx.restore();
}

function draw() {
  drawBG();
  drawChar(P); drawChar(AI);
  if(slowMo > 0) {
    // Dramatic strobe effect
    const strobe = (slowMo % 4 < 2);
    ctx.fillStyle = strobe ? 'rgba(255, 255, 255, 0.4)' : 'rgba(239, 68, 68, 0.2)';
    ctx.fillRect(0, 0, W, H);
    
    // Impactful K.O. Text
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.font = 'italic bold 100px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 25;
    // Jittery movement
    ctx.fillText('K.O.', W/2 + (Math.random()-0.5)*20, H/2 + 30);
    ctx.restore();
  }
}

function hud() {
  const pp=Math.max(0,P.hp), ap=Math.max(0,AI.hp);
  document.getElementById('p-hp').style.width=pp+'%';
  document.getElementById('p-hp').style.background=pp>50?'#4ade80':pp>25?'#fbbf24':'#f87171';
  document.getElementById('a-hp').style.width=ap+'%';
  document.getElementById('round-label').textContent='ROUND '+round;
  document.getElementById('score-label').textContent=scores[0]+' — '+scores[1];
}

function msg(t,d=60){ document.getElementById('msg').textContent=t; msgTimer=d; }

function attack(c,type) {
  if(c.attackTimer>0 || slowMo > 0 || c.state === 'block') return;
  
  let actualType = type;
  let dmgMult = 1;
  let moveName = type.toUpperCase();

  // Special Air Moves
  if (!c.onGround) {
    actualType = type === 'punch' ? 'airpunch' : 'airkick';
    dmgMult = 1.5;
    moveName = type === 'punch' ? 'DRAGON PUNCH' : 'FLYING KICK';
    // Add forward momentum for special air moves
    c.vx += c.facing * 5;
  }

  c.state=actualType; 
  c.attackTimer=type==='punch'?14:20;
  const reach=type==='punch'?58:68, dmg=Math.floor((type==='punch'?8:13) * dmgMult);
  const hx=c.facing===1?c.x+8:c.x-reach-8;
  c.hitbox={x:hx,y:c.y-44,w:reach,h:32,dmg, isSpecial: !c.onGround};
  
  if (!c.onGround) {
    msg(moveName + '!!', 40);
    beep(400, 0.1, 'sawtooth', 0.2); 
    // Particles or vibration effect could go here
  }
  snd[type]();
}


function checkHit(att,def) {
  if(!att.hitbox||att.attackTimer<=0||def.invincible>0) return;
  const hb=att.hitbox,dx=def.x-def.w/2,dy=def.y-def.h;
  if(hb.x<dx+def.w&&hb.x+hb.w>dx&&hb.y<dy+def.h&&hb.y+hb.h>dy){
    if(def.state==='block'){ 
      snd.block(); msg('BLOCKED!',40); 
      // Slight pushback even when blocking so you can't just stand still
      def.vx = (att.x < def.x ? 2.5 : -2.5);
    }
    else{ 
      def.hp-=hb.dmg; def.hitFlash=10; snd.hurt(); 
      // Add slight horizontal knockback
      def.vx = (att.x < def.x ? 5 : -5);
      if (def.hp <= 0) {
        slowMo = 70; // Reduced dramatic slow-mo
        shake = 40;   // Powerful screen shake
        snd.ko();
      }
      msg(att.isAI?'CPU HIT! -'+hb.dmg:'NICE HIT! +'+hb.dmg,45); 
    }
    att.hitbox=null; def.invincible=18; hud();
  }
}

let aiT=0, aiAct=null;
function aiStep() {
  aiT--; if(aiT>0) return;
  const s = DIFF_SETTINGS[difficulty];
  aiT = s.react[0] + Math.floor(Math.random() * (s.react[1] - s.react[0]));
  const d = Math.abs(AI.x-P.x), r = Math.random();
  
  // Jump logic (Special Moves)
  const jumpChance = difficulty === 'hard' ? 0.12 : (difficulty === 'med' ? 0.05 : 0);
  if (AI.onGround && r < jumpChance && d < 140) {
    aiAct = 'jump';
    aiT = 12;
    return;
  }

  if(d>130) aiAct='move';
  else if(r < s.block){ aiAct='block'; aiT=22; }
  else if(r < s.agg * 0.7) aiAct='punch';
  else if(r < s.agg) aiAct='kick';
  else aiAct='move';
}
function applyAI() {
  if(!running || slowMo > 0 || !AI.isAI) return;
  aiStep();
  const s = DIFF_SETTINGS[difficulty];
  const d = Math.abs(AI.x-P.x);
  
  if(aiAct==='jump' && AI.onGround) { 
    AI.vy=-12; AI.onGround=false; AI.state='jump'; snd.jump(); aiAct = 'mid-air'; 
  }
  
  if(aiAct==='mid-air' || !AI.onGround) {
    // Attack while in mid-air for special moves
    if (AI.attackTimer <= 0) attack(AI, Math.random() > 0.5 ? 'punch' : 'kick');
    return;
  }

  if(aiAct==='move') AI.vx+=(AI.x>P.x?-s.speed:s.speed);
  else if(aiAct==='block'){ AI.state='block'; AI.blockTimer=22; AI.vx=0; }
  else if(aiAct==='punch'&&d<85&&AI.attackTimer<=0) attack(AI,'punch');
  else if(aiAct==='kick'&&d<95&&AI.attackTimer<=0) attack(AI,'kick');
}

function tick(c) {
  if (slowMo > 0 && slowMo % 2 !== 0) return;
  c.x+=c.vx; c.vy+=GR; c.y+=c.vy;
  if(c.y>=FLOOR){ c.y=FLOOR; c.vy=0; c.onGround=true; if(c.state==='jump') c.state='idle'; }
  c.x=Math.max(22,Math.min(W-22,c.x)); c.vx*=0.75;
  if(c.hitFlash>0) c.hitFlash--;
  if(c.invincible>0) c.invincible--;
  if(c.attackTimer>0){ c.attackTimer--; if(c.attackTimer<=0){c.state='idle';c.hitbox=null;} }
  if(c.blockTimer>0){ c.blockTimer--; if(c.blockTimer<=0&&c.state==='block') c.state='idle'; }
  c.facing=c.x<(c.isAI?P.x:AI.x)?1:-1;
}

const keys={};
window.addEventListener('keydown',e=>{
  const c = e.code;
  const gameCodes = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyS','KeyD','KeyW','KeyQ','KeyE'];
  if(gameCodes.includes(c)) e.preventDefault();
  
  if(!keys[c]) {
    keys[c]=true;
    if(!running || slowMo > 0) return;
    
    // Jump: W, Space or ArrowUp
    if((c==='KeyW' || c==='Space' || c==='ArrowUp') && P.onGround){ 
        P.vy=-12; P.onGround=false; P.state='jump'; snd.jump(); 
    }
    // Actions
    if(c==='KeyA'){ if(P.attackTimer<=0) attack(P,'punch'); }
    if(c==='KeyS'){ if(P.attackTimer<=0) attack(P,'kick'); }
    
    // Combo Hint: If jumping and attacking, it's a special move
  }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });

function input() {
  if(!running || slowMo > 0) return;
  // Movement: Arrow Keys only
  if(keys['ArrowLeft']) P.vx=-2.6;
  if(keys['ArrowRight']) P.vx=2.6;
  // Block: D key
  if(keys['KeyD'] && P.attackTimer <= 0){ 
    P.state='block'; P.blockTimer=5; 
  }
}

function checkEnd() {
  if(P.hp>0&&AI.hp>0) return;
  if(slowMo > 0) return;

  running=false;
  const win=AI.hp<=0;

  if(win){ scores[0]++; snd.win(); msg('YOU WIN ROUND! 🏆', 300); }
  else   { scores[1]++; snd.lose(); msg('CPU WINS ROUND! 😤', 300); }
  
  hud();

  if (scores[0] >= 2 || scores[1] >= 2) {
      const matchWin = scores[0] >= 2;
      
      setTimeout(() => {
          msg(matchWin ? '🏆 YOU ARE CHAMPION! 🏆' : '💀 CPU IS CHAMPION 💀', 300);
          if (matchWin && userAddress) updateLeaderboardScore();
          scores = [0, 0];
          round = 1;
          document.getElementById('btn-fight').style.boxShadow = '0 0 20px #fbbf24';
          document.getElementById('btn-fight').textContent = '⚔ REMATCH?';
      }, 800); 
  } else {
      round++;
      setTimeout(() => { 
        msg('READY FOR ROUND ' + round + '?', 300); 
        document.getElementById('btn-fight').style.boxShadow = '0 0 20px #fbbf24';
        document.getElementById('btn-fight').textContent = '⚔ START R' + round;
      }, 800);
  }
}

function loop() {
  if(!running) return;
  if(slowMo > 0) slowMo--;
  if(shake > 0) shake--;
  
  input(); applyAI(); tick(P); tick(AI);
  checkHit(P,AI); checkHit(AI,P); checkEnd();
  if(msgTimer>0){ msgTimer--; if(msgTimer===0) document.getElementById('msg').textContent=''; }
  draw(); hud();
  raf=requestAnimationFrame(loop);
}

function fight() {
  if(raf) cancelAnimationFrame(raf);
  // Clear any stuck keys
  for(let k in keys) keys[k] = false;
  
  reset(); running=true; aiT=0; aiAct=null; slowMo=0; shake=0;
  document.getElementById('btn-fight').style.boxShadow = 'none';
  document.getElementById('btn-fight').textContent = '⚔ FIGHT!';
  const a = audio();
  if (a.state === 'suspended') a.resume();
  
  msg('FIGHT!',55); loop();
}

document.getElementById('btn-fight').addEventListener('click', fight);

// touch handlers
function holdBtn(id,fn){
  let iv;
  const b=document.getElementById(id);
  b.addEventListener('mousedown',()=>{fn();iv=setInterval(fn,80);});
  ['mouseup','mouseleave'].forEach(e=>b.addEventListener(e,()=>clearInterval(iv)));
  b.addEventListener('touchstart',e=>{e.preventDefault();fn();iv=setInterval(fn,80);},{passive:false});
  b.addEventListener('touchend',()=>clearInterval(iv));
}
holdBtn('btn-left', ()=>{ if(running && slowMo===0) P.vx=-2.6; });
holdBtn('btn-right',()=>{ if(running && slowMo===0) P.vx=2.6; });
document.getElementById('btn-jump').addEventListener('click',()=>{ if(running&&P.onGround&&slowMo===0){P.vy=-12;P.onGround=false;P.state='jump';snd.jump();} });
document.getElementById('btn-punch').addEventListener('click',()=>{ if(running&&P.attackTimer<=0&&slowMo===0) attack(P,'punch'); });
document.getElementById('btn-kick').addEventListener('click', ()=>{ if(running&&P.attackTimer<=0&&slowMo===0) attack(P,'kick'); });
document.getElementById('btn-block').addEventListener('click',()=>{ if(running&&slowMo===0){P.state='block';P.blockTimer=10;} });

reset(); draw(); hud();
</script>
</body>
