<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASE FIGHTER</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
body { background: #0a0a1f; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; color: #fff; padding: 10px; }
h1 { font-size: 28px; letter-spacing: 6px; color: #fbbf24; text-shadow: 0 0 20px #f59e0b88; margin-bottom: 8px; }
#subtitle { font-size: 11px; letter-spacing: 3px; color: #4a4a8a; margin-bottom: 10px; }
#wallet-bar { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
#wallet-addr { font-size: 11px; color: #4ade80; font-family: monospace; }
#leaderboard { max-width: 680px; width: 100%; margin-bottom: 10px; background: #1a1a2e; border: 1px solid #2a2a6e; border-radius: 8px; padding: 10px; }
#lb-title { font-size: 11px; color: #fbbf24; letter-spacing: 2px; margin-bottom: 6px; }
#lb-list { font-size: 11px; color: #555; font-family: monospace; line-height: 1.8; }
#container { background: #1a1a2e; border: 2px solid #4a4a8a; border-radius: 10px; padding: 14px; max-width: 680px; width: 100%; position: relative; }
#hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.hp-wrap { width: 230px; }
.hp-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.hp-bar { height: 14px; background: #111; border: 1px solid #333; border-radius: 2px; overflow: hidden; }
.hp-fill { height: 100%; transition: width 0.1s; border-radius: 2px; }
#p-hp { background: #4ade80; }
#a-hp { background: #f87171; float: right; }
.hp-wrap.right { text-align: right; }
#mid { text-align: center; min-width: 110px; }
#round-label { font-size: 15px; color: #fbbf24; font-weight: bold; }
#score-label { font-size: 11px; color: #555; margin-top: 2px; }
canvas { display: block; width: 100%; border: 2px solid #2a2a6e; border-radius: 4px; }
#msg { text-align: center; font-size: 16px; color: #fbbf24; letter-spacing: 3px; font-weight: bold; min-height: 26px; margin: 8px 0 4px; }
#ctrl { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.btn { background: #1e1e4e; color: #aaa; border: 1px solid #3a3a7a; border-radius: 4px; padding: 8px 14px; font-size: 12px; font-family: monospace; cursor: pointer; touch-action: manipulation; transition: background 0.1s, transform 0.1s; }
.btn:hover { background: #2a2a6e; color: #fff; }
.btn:active { transform: scale(0.95); background: #3a3a9e; }
#btn-fight { color: #fbbf24; border-color: #fbbf24; background: #2a2a1e; font-weight: bold; }
#hint { text-align: center; font-size: 10px; color: #333; margin-top: 6px; }
</style>
</head>
<body>
<h1>BASE FIGHTER</h1>
<div id="subtitle">BUILT ON BASE · PIXEL BRAWLER</div>

<div id="wallet-bar">
  <button class="btn" id="btn-connect">🔗 Connect Wallet (Base)</button>
  <span id="wallet-addr"></span>
</div>

<div id="leaderboard">
  <div id="lb-title">🏆 ON-CHAIN HIGH SCORES (Base)</div>
  <div id="lb-list">Connect wallet to load leaderboard...</div>
</div>

<div id="container">
  <div id="hud">
    <div class="hp-wrap">
      <div class="hp-label">PLAYER</div>
      <div class="hp-bar"><div class="hp-fill" id="p-hp" style="width:100%"></div></div>
    </div>
    <div id="mid">
      <div id="round-label">ROUND 1</div>
      <div id="score-label">0 — 0</div>
    </div>
    <div class="hp-wrap right">
      <div class="hp-label" style="text-align:right">CPU</div>
      <div class="hp-bar"><div class="hp-fill" id="a-hp" style="width:100%"></div></div>
    </div>
  </div>

  <canvas id="c" width="640" height="224"></canvas>
  <div id="msg">PRESS FIGHT TO START</div>

  <div id="ctrl">
    <button class="btn" id="btn-left">◀ LEFT</button>
    <button class="btn" id="btn-right">RIGHT ▶</button>
    <button class="btn" id="btn-jump">▲ JUMP [↑]</button>
    <button class="btn" id="btn-punch">👊 PUNCH [A]</button>
    <button class="btn" id="btn-kick">🦵 KICK [S]</button>
    <button class="btn" id="btn-block">🛡 BLOCK [D]</button>
    <button class="btn" id="btn-fight">⚔ FIGHT!</button>
    <button class="btn" id="btn-submit" style="display:none; color:#4ade80; border-color:#4ade80;">📝 Submit Score</button>
  </div>
  <div id="hint">
    ← → &nbsp;move &nbsp;|&nbsp; ↑ / Space &nbsp;jump &nbsp;|&nbsp; <span style="color:#4ade80">A</span> = punch &nbsp;|&nbsp; <span style="color:#4ade80">S</span> = kick &nbsp;|&nbsp; <span style="color:#4ade80">D</span> = block
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script>
// ==================== CONTRACT (το δικό μας) ====================
const CONTRACT_ADDRESS = "0xF3D403B94C4fee3957d331E49b83631227A1706C";
const CONTRACT_ABI = [
  "function submitScore(uint256 _score) public",
  "function getTopScores() public view returns (tuple(address player, uint256 score, uint256 timestamp)[])"
];

let provider, signer, contract, walletAddress = null;
let playerScore = 0;

// Connect
async function connectWallet() {
  if (!window.ethereum) return alert("MetaMask not found!");
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    walletAddress = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

    const short = walletAddress.slice(0,6) + "..." + walletAddress.slice(-4);
    document.getElementById("wallet-addr").innerHTML = `✅ ${short} <span style="color:#4ade80">(Base)</span>`;
    document.getElementById("btn-connect").textContent = "✅ Connected";
    loadLeaderboard();
  } catch(e) { console.error(e); }
}

// Leaderboard
async function loadLeaderboard() {
  if (!contract) return;
  try {
    const scores = await contract.getTopScores();
    if (scores.length === 0) {
      document.getElementById("lb-list").innerHTML = "No scores yet. Be the first!";
      return;
    }
    const html = scores.map((s, i) => {
      const short = s.player.slice(0,6) + "..." + s.player.slice(-4);
      const isMe = walletAddress && s.player.toLowerCase() === walletAddress.toLowerCase();
      const medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : "   ";
      return `<div style="color:${isMe?'#fbbf24':'#aaa'}">${medal} ${short} — ${Number(s.score)} pts${isMe?' (YOU)':''}</div>`;
    }).join("");
    document.getElementById("lb-list").innerHTML = html;
  } catch(e) {
    document.getElementById("lb-list").textContent = "Error loading leaderboard";
  }
}

// Submit
async function submitScore() {
  if (!contract) return alert("Connect wallet first!");
  try {
    const btn = document.getElementById("btn-submit");
    btn.textContent = "⏳ Submitting...";
    btn.disabled = true;
    const tx = await contract.submitScore(playerScore);
    await tx.wait();
    alert(`✅ Score ${playerScore} submitted on Base!`);
    btn.style.display = "none";
    loadLeaderboard();
  } catch(e) {
    alert("Transaction failed: " + e.message);
    document.getElementById("btn-submit").textContent = "📝 Submit Score";
    document.getElementById("btn-submit").disabled = false;
  }
}

// ==================== ΠΑΙΧΝΙΔΙ (ίδιο όπως πριν) ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 640, H = 224, FLOOR = 162, GR = 0.55;

// Audio + όλος ο κώδικας του παιχνιδιού (ακριβώς ίδιος με αυτόν που μου έστειλες)
let ac = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function beep(freq, dur, type='square', vol=0.15, detune=0) { /* ίδιο */ }
const snd = { /* ίδιο όπως πριν */ };

let P, AI, running=false, round=1, scores=[0,0], raf, msgTimer=0;

function mkChar(x, facing, isAI) { /* ίδιο */ }
function reset() { /* ίδιο */ }
function drawBG() { /* ίδιο */ }
function drawChar(c) { /* ίδιο */ }
function draw() { /* ίδιο */ }
function hud() { /* ίδιο */ }
function msg(t,d=60){ /* ίδιο */ }
function attack(c,type) { /* ίδιο */ }
function checkHit(att,def) {
  if(!att.hitbox||att.attackTimer<=0||def.invincible>0) return;
  const hb=att.hitbox,dx=def.x-def.w/2,dy=def.y-def.h;
  if(hb.x<dx+def.w&&hb.x+hb.w>dx&&hb.y<dy+def.h&&hb.y+hb.h>dy){
    if(def.state==='block'){ def.hp-=Math.ceil(hb.dmg*0.12); snd.block(); msg('BLOCKED!',40); }
    else{ 
      def.hp-=hb.dmg; def.hitFlash=10; snd.hurt(); 
      msg(att.isAI?'CPU HIT! -'+hb.dmg:'NICE HIT! +'+hb.dmg,45);
      if(!att.isAI) playerScore += Math.floor(hb.dmg * 2.5);  // score αυξάνεται
    }
    att.hitbox=null; def.invincible=18; hud();
  }
}
// AI, tick, input, checkEnd... (όλα ίδια)

function checkEnd() {
  if(P.hp>0&&AI.hp>0) return;
  running=false;
  const win=AI.hp<=0;
  if(win){ 
    scores[0]++; snd.win(); msg('YOU WIN! 🏆',200);
    playerScore += 300;   // bonus νίκης
  } else { 
    scores[1]++; snd.lose(); msg('CPU WINS! 😤',200); 
  }
  hud();
  document.getElementById('btn-submit').style.display = 'inline-block';
  document.getElementById('btn-submit').textContent = `📝 Submit ${playerScore} pts`;
  setTimeout(()=>{ document.getElementById('msg').textContent='Press FIGHT for next round'; },2500);
  round++;
}

// Loop + fight + buttons (ίδια)
function loop() { /* ίδιο */ }
function fight() {
  if(raf) cancelAnimationFrame(raf);
  playerScore = 0;   // reset score κάθε νέο fight
  reset(); running=true; aiT=0; aiAct=null;
  document.getElementById('btn-submit').style.display='none';
  audio(); msg('FIGHT!',55); loop();
}

// Event listeners
document.getElementById('btn-connect').addEventListener('click', connectWallet);
document.getElementById('btn-submit').addEventListener('click', submitScore);
document.getElementById('btn-fight').addEventListener('click', fight);

// touch buttons + keyboard (ίδια όπως πριν)
function holdBtn(id,fn){ /* ίδιο */ }
holdBtn('btn-left', ()=>{ if(running) P.vx=-2.6; });
holdBtn('btn-right',()=>{ if(running) P.vx=2.6; });
document.getElementById('btn-jump').addEventListener('click',()=>{ if(running&&P.onGround){P.vy=-12;P.onGround=false;P.state='jump';snd.jump();} });
document.getElementById('btn-punch').addEventListener('click',()=>{ if(running&&P.attackTimer<=0) attack(P,'punch'); });
document.getElementById('btn-kick').addEventListener('click', ()=>{ if(running&&P.attackTimer<=0) attack(P,'kick'); });
document.getElementById('btn-block').addEventListener('click',()=>{ if(running){P.state='block';P.blockTimer=10;} });

reset(); draw(); hud();
</script>
</body>
</html>
